<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Porto Alegre</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app-clima">
        <div id="loading" class="loading-container hidden" role="status" aria-live="polite">
            <img src="https://i.gifer.com/ZZ5H.gif" alt="Carregando...">
            <p> Buscando Clima...</p>
        </div>
        <div id="weatherContent" class="weather-content">
            <div class="container-clima">
                <div class="header-clima">
                    <h1>Clima Tempo</h1>
                    <p class="subtitulo-clima">Previsão do tempo em tempo real</p>
                </div>
                <!--barra de busca-->
                <div class="container-busca-clima">
                    <form id="formularioBusca" class="formulario-busca-clima">
                        <input type="text" id="imputCidade" placeholder="Buscar cidade (Ex: Curitiba)..."
                            class="imput-busca-clima" />
                        <button type="submit" id="Buscar" class="botao-busca-clima">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"
                                strokeLinejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                        </button>
                    </form>
                </div>

                <div id="conteudoClima" class="container-clima-atual">
                    <!-- Card Principal do Clima -->
                    <div class="card-clima">
                        <div class="cabecalho-card-clima">
                            <h2 id="nomeCidade">São Paulo</h2>
                            <p id="dataAtual" class="data-clima"></p>
                        </div>

                        <div class="principal-clima">
                            <div id="iconeClima" class="icone-clima"></div>
                            <div class="info-temperatura-clima">
                                <div class="temperatura-clima" id="temperatura">°</div>
                                <div class="condicao-clima" id="condicao"></div>
                                <div class="sensacao-clima" id="sensacao">°</div>
                            </div>
                        </div>

                        <div class="detalhes-clima">
                            <div class="item-detalhe-clima">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                                </svg>
                                <span class="rotulo-detalhe-clima">Umidade</span>
                                <span class="valor-detalhe-clima" id="umidade"></span>
                            </div>
                            <div class="item-detalhe-clima">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2">
                                    </path>
                                </svg>
                                <span class="rotulo-detalhe-clima">Vento</span>
                                <span class="valor-detalhe-clima" id="velocidadeVento">km/h</span>
                            </div>
                            <div class="item-detalhe-clima">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <span class="rotulo-detalhe-clima">Visibilidade</span>
                                <span class="valor-detalhe-clima" id="visibilidade">km</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="script.js"></script>

</body>

</html>
